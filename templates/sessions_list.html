{% extends 'base.html' %}
{% block content %}
<h2>Сессии</h2>
<a class="btn btn-success mb-2" href="{% url 'session_create' %}">Новая сессия</a>
<table class="table">
  <thead><tr><th>Игрок</th><th>Дата</th><th>Очки</th><th>Действия</th></tr></thead>
  <tbody>
    {% for s in sessions %}
    <tr>
      <td>{{ s.player.name }}</td>
      <td>{{ s.created_at }}</td>
      <td>{{ s.score }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{% url 'play_session' s.id %}">Играть / Продолжить</a>
        <a class="btn btn-sm btn-secondary" href="{% url 'session_view' s.id %}">Просмотр</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Сессий нет</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
