{% extends 'base.html' %}
{% block content %}
<h2>Вопросы</h2>
<a class="btn btn-success mb-2" href="{% url 'question_create' %}">Новый вопрос</a>
<table class="table">
  <thead><tr><th>Вопрос</th><th>Ответ</th><th>Действия</th></tr></thead>
  <tbody>
    {% for q in questions %}
    <tr>
      <td>{{ q.text }}</td>
      <td>{{ q.answer }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{% url 'question_edit' q.id %}">Редактировать</a>
        <form action="{% url 'question_delete' q.id %}" method="post" style="display:inline">
          {% csrf_token %}
          <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Удалить вопрос?');">Удалить</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">Вопросов нет</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
