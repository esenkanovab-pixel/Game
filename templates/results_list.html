{% extends 'base.html' %}
{% block content %}
<h2>Результаты</h2>
<table class="table">
  <thead><tr><th>Сессия</th><th>Игрок</th><th>Создано</th><th>Очки</th></tr></thead>
  <tbody>
    {% for s in sessions %}
    <tr>
      <td>{{ s.id }}</td>
      <td>{{ s.player.name }}</td>
      <td>{{ s.created_at }}</td>
      <td>{{ s.score }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Нет результатов</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
